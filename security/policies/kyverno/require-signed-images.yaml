apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Signed Images
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      All container images must be signed with Cosign before deployment.
      Unsigned images are blocked to prevent supply chain attacks.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - agentic-infra
      verifyImages:
        - imageReferences:
            - "gcr.io/*/agentic-infra/*:*"
            - "us-central1-docker.pkg.dev/*/agentic-infra/*:*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/kogunlowo123/agentic-infrastructure-engineering/.github/workflows/release.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
          mutateDigest: true
          verifyDigest: true
          required: true
