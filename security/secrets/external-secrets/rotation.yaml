apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: agentic-infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: jwt_secret_key
      remoteRef:
        key: agentic-infra/jwt-secret-key
        version: latest
    - secretKey: db_password
      remoteRef:
        key: agentic-infra/db-password
        version: latest
    - secretKey: identity_signing_key
      remoteRef:
        key: agentic-infra/identity-signing-key
        version: latest
