replicaCount: 2

image:
  repository: us-central1-docker.pkg.dev/PROJECT_ID/agentic-infra/api
  pullPolicy: IfNotPresent
  tag: ""

serviceAccount:
  create: true
  name: agentic-infra-api
  annotations:
    iam.gke.io/gcp-service-account: agentic-infra-api@PROJECT_ID.iam.gserviceaccount.com

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: api.agentic-infra.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-tls
      hosts:
        - api.agentic-infra.example.com

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

env:
  LOG_LEVEL: INFO
  AGENT_RUNTIME_URL: "http://agentic-infra-agent-runtime:8001"

envFrom:
  - secretRef:
      name: api-secrets

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

livenessProbe:
  httpGet:
    path: /api/v1/health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /api/v1/readiness
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
