[project]
name = "agent-runtime"
version = "0.1.0"
description = "Agent runtime service for IaC generation, drift detection, and cost optimization"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.12",
    "langchain-core>=1.6.5",
    "litellm>=1.102.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-hcl2>=4.3",
    "gitpython>=3.1",
    "PyJWT>=2.8",
    "cryptography>=42",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "requests>=2.31",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
