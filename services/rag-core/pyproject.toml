[project]
name = "rag-core"
version = "0.1.0"
description = "RAG core service for Terraform IaC document retrieval"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "opensearch-py>=2.4",
    "python-hcl2>=4.3",
    "litellm>=1.40",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "gitpython>=3.1",
    "pypdf2>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "torch>=2.3",
    "transformers>=4.40",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
