version: 2

updates:
  # ---------------------------------------------------------------------------
  # Python — services/api
  # ---------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - kogunlowo123
    assignees:
      - kogunlowo123
    labels:
      - dependencies
      - python
      - services/api
    groups:
      fastapi-stack:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "starlette"
          - "pydantic*"
      observability:
        patterns:
          - "opentelemetry*"
          - "prometheus*"

  # ---------------------------------------------------------------------------
  # Python — services/agent-runtime
  # ---------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: /services/agent-runtime
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - kogunlowo123
    assignees:
      - kogunlowo123
    labels:
      - dependencies
      - python
      - services/agent-runtime
    groups:
      langgraph-stack:
        patterns:
          - "langgraph*"
          - "langchain*"
          - "litellm*"
      gcp-sdk:
        patterns:
          - "google-cloud*"
          - "google-auth*"

  # ---------------------------------------------------------------------------
  # Python — services/rag-core
  # ---------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: /services/rag-core
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - kogunlowo123
    assignees:
      - kogunlowo123
    labels:
      - dependencies
      - python
      - services/rag-core
    groups:
      vector-search:
        patterns:
          - "pgvector*"
          - "opensearch*"

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - kogunlowo123
    assignees:
      - kogunlowo123
    labels:
      - dependencies
      - github-actions
    groups:
      actions-core:
        patterns:
          - "actions/*"
      docker-actions:
        patterns:
          - "docker/*"
      google-actions:
        patterns:
          - "google-github-actions/*"

  # ---------------------------------------------------------------------------
  # Terraform — infra/gcp (root modules and all environments)
  # ---------------------------------------------------------------------------
  - package-ecosystem: terraform
    directory: /infra/gcp/environments/dev
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - kogunlowo123
    assignees:
      - kogunlowo123
    labels:
      - dependencies
      - terraform
      - infra

  - package-ecosystem: terraform
    directory: /infra/gcp/environments/staging
    schedule:
      interval: weekly
      day: tuesday
